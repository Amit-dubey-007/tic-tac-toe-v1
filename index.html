<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>TIC-TAC-TOE GAME V.1</h1>
    <div class="game">
        <div class="text">
            <p id="p1">Player 1 [⭕]</p>
            <p id="vs">🆚</p>
            <p id="p2">Player 2 [❌] </p>
        </div>
        <div class="win hidden">
            <p class="win-text"></p>
        </div>
        <div class="board">
            <div class="box" data-index="0"></div>
            <div class="box" data-index="1"></div>
            <div class="box" data-index="2"></div>
            <div class="box" data-index="3"></div>
            <div class="box" data-index="4"></div>
            <div class="box" data-index="5"></div>
            <div class="box" data-index="6"></div>
            <div class="box" data-index="7"></div>
            <div class="box" data-index="8"></div>
        </div>
        <button class="newgame">New Game</button>
    </div> 
    <script src="script.js"></script>
</body>
</html>
